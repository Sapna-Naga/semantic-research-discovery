name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/module1.txt

      - name: Lint (ruff)
        run: |
          ruff check .

      - name: Type check (mypy - best effort)
        run: |
          mypy src/semantic_research || true

      - name: Tests
        run: |
          pytest -q
